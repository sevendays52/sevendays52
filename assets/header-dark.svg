<svg xmlns="http://www.w3.org/2000/svg" width="840" height="184" viewBox="0 0 840 184" fill="none">
  <defs>
    <pattern id="dot-grid-dark" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1" fill="#ffffff" fill-opacity="0.06" />
    </pattern>
    <linearGradient id="fade-right-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.9" />
      <stop offset="55%" stop-color="#0d1117" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0.85" />
    </linearGradient>
    <linearGradient id="wave-grad-dark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#30363d" />
      <stop offset="50%" stop-color="#8b949e" />
      <stop offset="100%" stop-color="#e6edf3" />
    </linearGradient>
  </defs>

  <!-- Base card -->
  <rect x="0.5" y="0.5" width="839" height="183" rx="10" fill="#0d1117" stroke="#30363d" />
  <rect x="1" y="1" width="838" height="182" rx="9.5" fill="url(#dot-grid-dark)" />
  <rect x="1" y="1" width="838" height="182" rx="9.5" fill="url(#fade-right-dark)" />

  <!-- Subtle corner crosshairs -->
  <path d="M18 14 V22 M14 18 H22" stroke="#30363d" stroke-width="1" />
  <path d="M822 14 V22 M818 18 H826" stroke="#30363d" stroke-width="1" />
  <path d="M18 162 V170 M14 166 H22" stroke="#30363d" stroke-width="1" />
  <path d="M822 162 V170 M818 166 H826" stroke="#30363d" stroke-width="1" />

  <!-- Left: Editorial Typography -->
  <g transform="translate(42, 46)">
    <circle cx="5" cy="0" r="3" fill="#e6edf3" />
    <text x="16" y="4" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" letter-spacing="2">
      LAB // SEVENDAYS52
    </text>

    <text x="0" y="52" fill="#f0f6fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="36" font-weight="600" letter-spacing="-0.8">
      HanJoo Kim
    </text>

    <text x="0" y="84" fill="#8b949e" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="12.5" letter-spacing="0.2">
      AI Engineering · Virtual Streaming · Unity 3D · Data
    </text>
  </g>

  <!-- Right: Minimalist Isometric Wireframe + Signal Line -->
  <g transform="translate(650, 34)" stroke-linecap="round" stroke-linejoin="round">
    <!-- Outer isometric cube -->
    <polygon points="75,8 134,42 134,110 75,144 16,110 16,42" stroke="#30363d" stroke-width="1.2" fill="none" />
    <polyline points="16,42 75,76 134,42" stroke="#484f58" stroke-width="1.2" fill="none" />
    <line x1="75" y1="76" x2="75" y2="144" stroke="#484f58" stroke-width="1.2" />

    <!-- Inner wireframe mesh -->
    <polygon points="75,34 108,53 108,91 75,110 42,91 42,53" stroke="#6e7681" stroke-width="1" stroke-dasharray="3 3" fill="none" />
    <polyline points="42,53 75,72 108,53" stroke="#8b949e" stroke-width="1" fill="none" />
    <line x1="75" y1="72" x2="75" y2="110" stroke="#8b949e" stroke-width="1" />

    <!-- Signal wave -->
    <path d="M-40 94 Q -10 94, 16 76 T 75 74 T 134 56" stroke="url(#wave-grad-dark)" stroke-width="1.3" fill="none" opacity="0.85" />

    <!-- Key vertices -->
    <circle cx="75" cy="8" r="2.2" fill="#8b949e" />
    <circle cx="75" cy="76" r="2.8" fill="#f0f6fc" />
    <circle cx="134" cy="42" r="2.2" fill="#8b949e" />
    <circle cx="16" cy="110" r="2.2" fill="#6e7681" />
  </g>
</svg>
